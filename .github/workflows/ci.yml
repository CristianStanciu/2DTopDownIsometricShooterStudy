# P0.E6.T1 — CI: import · compile · EditMode tests on PR/push → develop/main.
# The "Warning gate" step implements the P0.E2.T4 warning-zero policy
# (docs/qa/warning-policy.md): any new `Warning CS…` / `error CS…` line fails the run.
#
# Required repo secrets (see docs/essential/getting-started.md):
#   UNITY_LICENSE  — contents of the personal-license .ulf (one-time activation)
#   UNITY_EMAIL / UNITY_PASSWORD — Unity account used for license validation
name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editmode:
    name: EditMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      # One batchmode session performs import + compile + EditMode tests.
      # Test results (NUnit/JUnit XML) land in the artifacts folder; githubToken
      # makes the action publish them as a check run named `checkName`.
      # `-logFile unity-editor.log` persists compiler diagnostics for the gate step.
      - name: Import · compile · EditMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.20f1
          projectPath: .
          testMode: editmode
          artifactsPath: editmode-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode test results
          coverageEnabled: false # re-enabled with P0.E7.T3 (no test assemblies yet)
          customParameters: -nographics -logFile unity-editor.log

      # P0.E2.T4 warning-zero policy — fail on any compiler diagnostic line.
      # Runs even when the test step failed, so diagnostics are always surfaced.
      - name: Warning gate — fail on warning/error CS lines
        if: always()
        run: |
          shopt -s globstar nullglob
          pattern='(warning|error) CS[0-9]+'
          hits=0
          scanned=0
          for f in unity-editor.log editmode-results/**/*.log; do
            [ -f "$f" ] || continue
            scanned=1
            if grep -HnEi "$pattern" "$f"; then hits=1; fi
          done
          if [ "$hits" -ne 0 ]; then
            echo "::error::Compiler diagnostics found - warning-zero policy (P0.E2.T4, docs/qa/warning-policy.md)"
          elif [ "$scanned" -eq 0 ]; then
            echo "::warning::No Unity log found to scan - warning gate could not run (check -logFile plumbing)"
          fi
          exit "$hits"

      # P0.E2.T7 — deterministic package restore: Unity must resolve strictly from the
      # committed Packages/packages-lock.json (locked mode). Any drift during the
      # import/test session means the restore was nondeterministic → fail the run.
      - name: Deterministic restore gate (packages-lock.json unchanged)
        if: always()
        run: |
          set -euo pipefail
          if git diff --exit-code -- Packages/packages-lock.json; then
            echo "packages-lock.json unchanged - restore is lock-deterministic"
          else
            echo "::error::packages-lock.json changed during import - nondeterministic package restore (P0.E2.T7)"
            exit 1
          fi

      - name: Upload test results + editor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editmode-test-results
          path: |
            editmode-results
            unity-editor.log
          if-no-files-found: warn
          retention-days: 14
